<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Quiz</title>

</head>
    <body class="page">
        <audio src="/assets/fundo-musical.mp3" id="audio-back"   loop ></audio>
        <audio src="/assets/audio-erro.mp3" id="audio-erro"></audio>
        <audio src="/assets/audio-correct.mp3" id="audio-correct"></audio>
    <main class="quiz">
            <header class="quiz__header">
                <h1 class="quiz__title">Quiz</h1>
                <p class="quiz__subtitle">Teste seus conhecimentos em nosso quiz!</p>
            </header>
           
            <button class="quiz__start" id="start-quiz" type="button">Iniciar Quiz</button>

            <form class="quiz__question quiz__question--hidden"  id="question-1">
                <p class="quiz__question-label">Questão 1</p>
                <p class="quiz__question-text">Qual é o país que possui mais pirâmides no mundo?</p>
                <div class="quiz__options">
                    <button class="quiz__option" data-correct>
                        <span class="quiz__option-letter">A</span>
                        <p class="quiz__option-text">Sudão</p>
                    </button>
                    <button class="quiz__option">
                        <span class="quiz__option-letter">B</span>
                        <p class="quiz__option-text">Egito </p>
                    </button>
                    <button class="quiz__option">
                        <span class="quiz__option-letter">C</span>
                        <p class="quiz__option-text">Peru</p>
                    </button>
                    <button class="quiz__option">
                        <span class="quiz__option-letter">D</span>
                        <p class="quiz__option-text">China</p>
                    </button>
                </div>
            </form>
            <form class="quiz__question quiz__question--hidden" id="question-2">
                <p class="quiz__question-label">Questão 2</p>
                <p class="quiz__question-text">Quantos corações tem um polvo?</p>
                <div class="quiz__options">
                    <button class="quiz__option">
                        <span class="quiz__option-letter">A</span>
                        <p class="quiz__option-text">Nenhum</p>
                    </button>
                    <button class="quiz__option">
                        <span class="quiz__option-letter">B</span>
                        <p class="quiz__option-text">Um</p>
                    </button>
                    <button class="quiz__option">
                        <span class="quiz__option-letter">C</span>
                        <p class="quiz__option-text">Dois</p>
                    </button>
                    <button class="quiz__option" data-correct>
                        <span class="quiz__option-letter">D</span>
                        <p class="quiz__option-text">Três</p>
                    </button>
                </div>
            </form>
            <form class="quiz__question quiz__question--hidden" id="question-3">
                <p class="quiz__question-label">Questão 3</p>
                <p class="quiz__question-text">Qual é o metal mais caro do mundo?</p>
                <div class="quiz__options">
                    <button class="quiz__option" data-correct="true">
                        <span class="quiz__option-letter">A</span>
                        <p class="quiz__option-text">O ródio</p>
                    </button>
                    <button class="quiz__option"data-correct >
                        <span class="quiz__option-letter">B</span>
                        <p class="quiz__option-text">O Ouro</p>
                    </button>
                    <button class="quiz__option">
                        <span class="quiz__option-letter">C</span>
                        <p class="quiz__option-text">O Diamante</p>
                    </button>
                    <button class="quiz__option">
                        <span class="quiz__option-letter">D</span>
                        <p class="quiz__option-text">Numb-Linkin Park</p>
                    </button>
                </div>
            </form>

            <div class="quiz__score quiz__score--hidden">
                <p class="quiz__score-label">Pontuação: <span class="quiz__score-value" id="score">0</span></p>
            </div>

            <button class="quiz__start quiz__start--hidden" id="finish-quiz" type="button">Finalizar quiz</button>

            
    
    </main>
    <script src="script/quiz.js"></script>
    
</body>
</html>
